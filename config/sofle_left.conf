# 仅左半 (central) 生效; 在 sofle.conf 之后加载, 可覆盖其中的同名选项
# Left half (central) only. ZMK loads this after sofle.conf, so anything set in
# both files takes its value from here.

# 读取右半电量, 并通过额外的 BAS 服务上报给主机
# 否则只能在直接连接右半时才看得到它的电量
# Read the right half's battery level over the split link and report it to the
# host through an extra Battery Service. Without these you can only see the
# right half's charge by pairing to it directly.
# NOTE: the second BAS instance is the part Windows has historically handled
# badly - back this out first if host battery display misbehaves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
