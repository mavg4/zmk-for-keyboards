# 电池电量报告间隔时间单位是秒
# Battery level reporting interval, in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
# Keyboard debounce. NOTE: the default is -1, meaning "use the devicetree
# property", which is itself 5ms - so these two lines change nothing. Raise the
# numbers if you actually want more debounce.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 增加键盘的 BLE 无线电的发射功率，用解决延迟和左右通讯不佳的问题
# Raise BLE radio TX power to +8dBm, to fix latency and poor left/right comms.
# Costs battery; CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y targets link stability more
# directly if you want to trade this back.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 更改键盘默认显示名称
# Override the keyboard's advertised name (shield default is "Sofle")
CONFIG_ZMK_KEYBOARD_NAME="Sofle_RGB"
# 用于解决 Windows 中与电池报告相关的错误
# Works around a Windows bug related to battery reporting
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# oled相关配置
# OLED / display settings
CONFIG_ZMK_DISPLAY=y
# 专用队列: &disp_pwr 重新初始化屏幕时会阻塞约 110ms, 不应占用系统队列
# Dedicated queue: &disp_pwr blocks for ~110ms while re-initializing the panel,
# which must not stall the shared system work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Enable a widget to show words per minute
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
#CONFIG_ZMK_WIDGET_LAYER_STATUS=n
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
#Bongo cat猫猫敲键盘动画
#Bongo cat typing animation (not in upstream ZMK; needs a module)
#CONFIG_ZMK_WIDGET_BONGO_CAT=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# 电量以数字显示, 而不仅是图标
# Show the battery level as a number, not just an icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

#休眠相关配置
# Idle / sleep settings
# 启用 soft-off, 否则键位表里的 &soft_off 无效 (需要复位键唤醒)
# Enable soft-off, otherwise the &soft_off keys in the keymap do nothing.
# Waking from it needs the reset button on each half.
CONFIG_ZMK_PM_SOFT_OFF=y
# Milliseconds of inactivity before entering idle state	(30 sec)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (5 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# zmk studio相关配置
# ZMK Studio settings. NOTE: Studio saves its keymap to settings, which then
# shadows sofle.keymap - flash the settings_reset target if file edits stop
# taking effect. With LOCKING=n anyone who pairs can rewrite the keymap.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# 无效: 该选项位于 if ZMK_STUDIO_LOCKING 之内, 而 LOCKING=n
# Ignored: this symbol only exists inside `if ZMK_STUDIO_LOCKING`, which is n
#CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

#rgb相关配置
# RGB settings - disabled, this board has no LEDs installed.
# Commented out rather than deleted so it can be restored. The matching
# devicetree (spi3 / ws2812 / zmk,underglow) is commented out in sofle.dtsi.
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_WS2812_STRIP=y
#键盘进入空闲状态时关闭RGB
#Turn off RGB when the keyboard goes idle
#CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
#CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
#CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

#旋钮配置
# Rotary encoder settings
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
